AWSTemplateFormatVersion: '2010-09-09'
Description: テスト環境を作成するCloudFormationサンプル
#  awse cloudformation create-stack --stack-name emulator --template-body file://emulator.yaml --capabilities CAPABILITY_IAM

Parameters:
  EnvName:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - stg
      - prod

Resources:
  MyBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${AWS::StackName}-${EnvName}-bucket-${AWS::AccountId}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  SampleQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub '${AWS::StackName}-${EnvName}-queue'
      VisibilityTimeout: 60

  SampleTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: !Sub '${AWS::StackName}-${EnvName}-dynamodb'
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: Id
            AttributeType: S
        KeySchema:
          - AttributeName: Id
            KeyType: HASH

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: SqsConsumerPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                Resource: !GetAtt SampleQueue.Arn

  SampleLambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-${EnvName}-lambda'
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 30
      MemorySize: 128
      Code:
        ZipFile: |
          import json

          def handler(event, context):
              for record in event.get("Records", []):
                  print("Message body:", record.get("body"))

              return {"statusCode": 200}

  SampleLambdaSqsMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !GetAtt SampleQueue.Arn
      FunctionName: !GetAtt SampleLambdaFunction.Arn
      BatchSize: 10
      Enabled: true
