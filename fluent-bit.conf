[SERVICE]
    Flush 1
    Log_Level info

[INPUT]
    Name tail
    Path /var/lib/docker/containers/*/*-json.log
    Tag docker
    Parser docker
    Refresh_Interval 5

[OUTPUT]
    Name cloudwatch_logs
    Match docker

    region ap-northeast-1

    tls.ca_file /${HOME}/.aws/emulator/9297/ca.pem

    log_group_name test-group
    log_stream_prefix test-

    auto_create_group true

    endpoint aws-emulator
    port 9297

[OUTPUT]
    Name stdout
    Match docker