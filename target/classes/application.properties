spring.application.name=emulator-playground
spring.docker.compose.enabled=false

logging.level.root=DEBUG
logging.level.one.enchanter=DEBUG
logging.pattern=%d{yyyy-MM-dd HH:mm:ss} [%thread] [%X{requestId}] %-5level %logger{36} - %msg%n
logging.file.name=logs/app.log

# アクセスログはCloudFrontで出力する。
# server.tomcat.accesslog.enabled=true
# server.tomcat.accesslog.pattern=%h %l %u "%r" %s %b "%{User-Agent}i"
# server.tomcat.accesslog.directory=/dev/stdout
# server.tomcat.accesslog.prefix=console
# server.tomcat.accesslog.suffix=
# server.tomcat.accesslog.file-date-format=

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.same-site=lax

# ローカル開発環境用のデータソース設定.
# ホスト名は、WSLからはlocalhot. コンテナ内からはサービス名となる。
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/emulator
spring.datasource.username=emulator
spring.datasource.password=emulator
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

# aws emulatorの設定
aws.emulator.region=ap-northeast-1
aws.emulator.endpoint=https://aws-emulator:9297
aws.emulator.endpoint.dynamodb=http://dynamodb:8000
#aws.emulator.endpoint.dynamodb=https://aws-emulator:9297
